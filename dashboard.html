<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Manakamana Public Academy</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDokbUJuiMGh2v2agyvlyKfHiM1DCQ5wOE",
    authDomain: "manakamana-website.firebaseapp.com",
    projectId: "manakamana-website",
    storageBucket: "manakamana-website.firebasestorage.app",
    messagingSenderId: "808390020313",
    appId: "1:808390020313:web:94c9fb355da292825a82c8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById('userEmail').textContent = user.email;
    }
  });

  window.logout = function () {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
  }

  nav {
    background: #1e3a8a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    color: white;
    flex-wrap: wrap;
  }
  nav .logo { font-size: 18px; font-weight: bold; }
  nav button {
    background: #ffd700;
    color: #1e3a8a;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  .welcome {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    padding: 40px 20px;
    text-align: center;
  }
  .welcome h1 { font-size: 26px; margin-bottom: 8px; }
  .welcome p { color: #cfe0ff; font-size: 14px; }

  .grid {
    max-width: 900px;
    margin: 30px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 0 20px;
  }
  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    padding: 25px;
    width: 250px;
    text-align: center;
  }
  .card .icon { font-size: 34px; margin-bottom: 10px; }
  .card h3 { color: #1e3a8a; margin-bottom: 6px; }
  .card p { color: #666; font-size: 14px; }
</style>
</head>
<body>

  <nav>
    <div class="logo">🎓 Student Dashboard</div>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="welcome">
    <h1>Welcome!</h1>
    <p id="userEmail">Loading...</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="icon">📢</div>
      <h3>Notices</h3>
      <p>Latest announcements from school</p>
    </div>
    <div class="card">
      <div class="icon">📊</div>
      <h3>Results</h3>
      <p>Check your exam results</p>
    </div>
    <div class="card">
      <div class="icon">🗓️</div>
      <h3>Timetable</h3>
      <p>View your class schedule</p>
    </div>
    <div class="card">
      <div class="icon">📖</div>
      <h3>Study Materials</h3>
      <p>Access notes and resources</p>
    </div>
  </div>

</body>
</html>
