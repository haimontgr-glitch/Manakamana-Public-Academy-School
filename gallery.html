<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Manakamana Public Academy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #fdfdfd; }
  nav {
    background: #1e3a8a; display: flex; justify-content: space-between;
    align-items: center; padding: 15px 30px; flex-wrap: wrap;
  }
  nav .logo { color: #ffd700; font-size: 18px; font-weight: bold; }
  nav .links { display: flex; gap: 18px; flex-wrap: wrap; }
  nav a { color: white; text-decoration: none; font-size: 15px; font-weight: 600; }
  nav a:hover { color: #ffd700; }
  nav .login-btn { background: #ffd700; color: #1e3a8a !important; padding: 8px 18px; border-radius: 20px; }

  .hero {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white; text-align: center; padding: 60px 20px;
  }
  .hero h1 { font-size: 32px; }

  .grid {
    max-width: 950px; margin: 50px auto; display: flex; flex-wrap: wrap;
    gap: 15px; justify-content: center; padding: 0 20px;
  }
  .photo {
    width: 280px; height: 200px; background: #cfe0ff;
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: #1e3a8a; font-size: 40px; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  }

  footer { background: #1e3a8a; color: #cfe0ff; text-align: center; padding: 22px; margin-top: 40px; font-size: 14px; }
</style>
</head>
<body>

  <nav>
    <div class="logo">🎓 Manakamana Public Academy</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="courses.html">Courses</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="login-btn">Login</a>
    </div>
  </nav>

  <div class="hero"><h1>Gallery</h1></div>

  <div class="grid">
    <div class="photo">🏫</div>
    <div class="photo">🎓</div>
    <div class="photo">📚</div>
    <div class="photo">⚽</div>
    <div class="photo">🎨</div>
    <div class="photo">🏆</div>
  </div>

  <footer>&copy; 2026 Manakamana Public Academy, Kohalpur-2, Banke.</footer>

</body>
</html>
